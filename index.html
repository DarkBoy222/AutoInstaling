<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Moja strona</title>
<style>
body {
  margin: 0;
  font-family: Arial;
  background: #101025;
  color: white;
  text-align: center;
}
main { padding: 100px 20px; }
h1 { font-size: 55px; }
span { color: #8b7bff; }
button {
  padding: 16px 30px;
  border: 0;
  border-radius: 12px;
  background: #7865ff;
  color: white;
  cursor: pointer;
  font-size: 17px;
}
button:hover { transform: scale(1.08); }
</style>
</head>
<body>
<main>
<h1>Witaj na <span>mojej stronie!</span></h1>
<p>To jest moja pierwsza publiczna strona internetowa.</p>
<button onclick="alert('Witaj!')">Kliknij mnie!</button>
</main>
</body>
</html>
